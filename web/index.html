<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FTC Logger</title>
  <link rel="stylesheet" href="/logger/style.css" />
</head>
<body>
<div id="app">

  <!-- COLUMN 1: Robot control, configurables -->
  <aside class="panel leftPanel">
    <!-- OpMode control (mirrors the Driver Station: select → INIT → ▶ / ■) -->
    <div class="panelSection opCtl" data-state="unavailable" id="opCtl">
      <div class="opCtlHeader">
        <div class="small"><b>Robot</b></div>
        <div class="opCtlState"><span class="opCtlDot"></span><span id="opCtlStateText">Connecting…</span></div>
      </div>
      <select id="opCtlSel" class="select" disabled></select>
      <div class="opCtlButtons">
        <button id="opCtlInit" class="opBtn opInit" title="Initialize the selected OpMode">INIT</button>
        <button id="opCtlStart" class="opBtn opStart" title="Start" aria-label="Start">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button id="opCtlStop" class="opBtn opStop" title="Stop (Space)" aria-label="Stop" aria-keyshortcuts="Space">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>
        </button>
      </div>
      <div id="opCtlMsg" class="small opCtlMsg"></div>
      <div class="small opCtlKeyHint">Press <kbd>Space</kbd> to stop</div>
    </div>

    <div class="leftScroll">
      <div class="panelSection configSection">
        <div class="configHeader">
          <div class="small"><b>Configurable</b></div>
          <button id="refreshConfig" class="btn btnSmall" title="Reload current values from the robot">↻</button>
        </div>
        <div id="configList"></div>
        <div class="small hint">
          Edit a value and press Enter to send it to the robot.
        </div>
      </div>
    </div>
  </aside>

  <!-- COLUMN 2: Telemetry, log picker, plot series -->
  <aside class="panel telemetryPanel">
    <div class="panelSection telemetrySection">
      <div class="configHeader">
        <div class="small"><b>Telemetry</b></div>
        <span id="telemetryMeta" class="small telemetryMeta"></span>
      </div>
      <div id="telemetry" class="telemetry"><div class="small">No telemetry yet. INIT an OpMode to see it here.</div></div>
    </div>
    <div class="panelSection logSection">
      <div class="configHeader">
        <div class="small"><b>Logs</b></div>
        <button id="openManager" class="btn btnSmall toggle">Manage</button>
      </div>
      <div class="small">OpMode</div>
      <select id="opModeSel" class="select"></select>
      <div class="small">Run</div>
      <select id="runSel" class="select"></select>
    </div>

    <div class="panelSection series">
      <div class="small"><b>Series</b></div>
      <div id="seriesList"></div>
    </div>
  </aside>

  <!-- MIDDLE: Plot -->
  <main class="main">
    <div class="mainHeader">
      <div>
        <div><b>Plot</b></div>
        <div class="small" id="status">No run loaded</div>
      </div>

      <!-- Tools are on the RIGHT -->
      <div class="tools">
        <button id="liveToggle" class="btn toggle liveBtn"><span class="liveDot"></span>Live</button>
        <button id="zoomExtents" class="btn">Extents</button>
        <button id="zoomIn" class="btn">Zoom +</button>
        <button id="zoomOut" class="btn">Zoom −</button>
        <button id="selectTool" class="btn">Selection</button>
        <button id="panTool" class="btn toggle">Pan</button>
        <button id="openTable" class="btn toggle">Table</button>
      </div>
    </div>

    <div class="canvasWrap">
      <canvas id="plot"></canvas>
      <canvas id="overlay"></canvas>
      <div id="hoverTime" class="hoverTime"></div>
    </div>

    <div id="stats">
      <div class="statsHeader">
        <div><b>Stats</b></div>
        <button id="toggleReg" class="btn">Add regression</button>
      </div>
      <div class="statsBody">
        <table id="statsTbl">
          <thead><tr id="statsHead"></tr></thead>
          <tbody id="statsBody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- RIGHT: Table drawer (collapsed unless opened) -->
  <aside id="tableDrawer" class="tableDrawer">
    <div class="drawerHeader">
      <div class="drawerHeaderLeft">
        <button id="closeTable" class="btn">⟩</button>
        <div>
          <div><b>Table</b></div>
          <div class="small">Selected run data</div>
        </div>
      </div>
    </div>

    <div class="drawerBody">
      <table id="tbl">
        <thead><tr id="tblHead"></tr></thead>
        <tbody id="tblBody"></tbody>
      </table>
    </div>
  </aside>

</div>

<div id="manageModal" class="modal hidden">
  <div class="modalBackdrop" id="closeManager"></div>
  <div class="modalCard">
    <div class="modalHeader">
      <div>
        <div><b>Manage Log Files</b></div>
        <div class="small">Rename or delete runs and OpModes</div>
      </div>
      <div class="modalActions">
        <button id="refreshFs" class="btn">Refresh</button>
        <button id="closeManagerBtn" class="btn">Close</button>
      </div>
    </div>
    <div class="modalBody">
      <div id="fsTree" class="fsTree"></div>
    </div>
  </div>
</div>

<script src="/logger/app.js"></script>
</body>
</html>
